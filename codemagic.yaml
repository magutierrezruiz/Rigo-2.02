workflows:
  android-v2-fix5-direct:
    name: AlgebrAventura 2.0 FIX5 - sin Gradle
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Confirmar configuración FIX5
        script: |
          set -e
          echo "FIX5: COMPILACION DIRECTA SIN GRADLE"
          echo "Branch: $CM_BRANCH"
          echo "Commit: $CM_COMMIT"
          java -version

      - name: Preparar Android SDK 35
        script: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Compilar y firmar APK 2.0 sin Gradle
        script: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          chmod +x build-apk.sh
          ./build-apk.sh

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
